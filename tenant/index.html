<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="Landlord Desk tenant app demo.">
  <title>Tenant app | Landlord Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="tenant-demo-layout">
    <div class="phone-frame" aria-label="Tenant app virtual phone">
      <div class="phone-screen">
        <div class="phone-status" aria-label="Phone status">
          <span>9:41</span><span class="phone-notch" aria-hidden="true"></span>
          <span class="phone-status-icons"><i class="bi bi-reception-4" aria-hidden="true"></i><i class="bi bi-wifi" aria-hidden="true"></i><i class="bi bi-battery-full" aria-hidden="true"></i></span>
        </div>
        <div class="tenant-app" id="tenantApp" data-theme="light">
          <header class="tenant-topbar">
            <button class="topbar-icon d-none" id="backButton" type="button" aria-label="Back to home"><i class="bi bi-arrow-left"></i></button>
            <a class="tenant-brand" href="#/home" aria-label="Landlord Desk Home"><span class="tenant-brand-mark"><i class="bi bi-buildings"></i></span><span id="topbarTitle">Landlord Desk</span></a>
            <button class="topbar-icon notification-button d-none" id="notificationButton" type="button" aria-label="Notifications">
              <i class="bi bi-bell"></i><span class="notification-count d-none" id="notificationCount"></span>
            </button>
          </header>
          <main class="tenant-view" id="tenantView" tabindex="-1">
            <div class="tenant-loading" role="status"><span class="spinner-border spinner-border-sm me-2"></span>Loading your home…</div>
          </main>
          <nav class="tenant-tabs d-none" id="tenantTabs" aria-label="Tenant app sections">
            <a class="tenant-tab" href="#/home" data-route="/home"><i class="bi bi-house-door"></i><span>Home</span></a>
            <a class="tenant-tab" href="#/payments" data-route="/payments"><i class="bi bi-credit-card"></i><span>Payments</span></a>
            <a class="tenant-tab" href="#/issues" data-route="/issues"><i class="bi bi-tools"></i><span>Issues</span></a>
            <a class="tenant-tab" href="#/documents" data-route="/documents"><i class="bi bi-folder2"></i><span>Documents</span></a>
            <a class="tenant-tab" href="#/more" data-route="/more"><i class="bi bi-three-dots"></i><span>More</span></a>
          </nav>
        </div>
      </div>
    </div>
    <p class="phone-caption">Tenant app demo<br><span>View on your phone for the real feel</span></p>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
