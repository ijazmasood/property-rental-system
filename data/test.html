<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landlord Desk | Data layer check</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8f5; color: #20332e; }
    .brand { color: #153b35; }
    .status { min-height: 1.5rem; }
    .table { --bs-table-bg: #fff; }
  </style>
</head>
<body>
  <main class="container py-5">
    <div class="mb-4">
      <p class="small text-uppercase text-secondary fw-semibold mb-1">Landlord Desk</p>
      <h1 class="h2 brand">Shared data layer check</h1>
      <p class="text-secondary mb-0">Loads every JSON collection through <code>store.js</code> and reports its record count.</p>
    </div>
    <div id="result" class="status alert alert-info" role="status" aria-live="polite">Loading demo data…</div>
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead>
          <tr><th scope="col">Collection</th><th scope="col" class="text-end">Records</th></tr>
        </thead>
        <tbody id="counts"></tbody>
      </table>
    </div>
    <p id="sample" class="small text-secondary mb-0"></p>
  </main>
  <script type="module">
    import { COLLECTIONS, loadAll } from './store.js';
    import { formatCurrency } from './helpers/currency.js';
    import { formatDate } from './helpers/date.js';
    import { getDocumentStatus, getRentStatus } from './helpers/status.js';

    const result = document.querySelector('#result');
    const counts = document.querySelector('#counts');
    const sample = document.querySelector('#sample');

    try {
      const data = await loadAll();
      counts.innerHTML = COLLECTIONS.map((collection) => {
        const value = data[collection];
        const count = Array.isArray(value) ? value.length : 1;
        return `<tr><th scope="row">${collection}</th><td class="text-end">${count}</td></tr>`;
      }).join('');

      const config = data.config;
      const firstRent = data.rentSchedule.find((item) =>
        item.tenantId === 't1' && item.dueDate.startsWith(config.demoToday.slice(0, 7))
      );
      const firstDocument = data.documents.find((item) => item.expiryDate);
      result.className = 'status alert alert-success';
      result.textContent = `Loaded ${COLLECTIONS.length} collections. Demo date: ${formatDate(config.demoToday)}.`;
      sample.textContent = `Currency: ${formatCurrency(data.properties[0].monthlyRent, config)} · ` +
        `Aisha rent status: ${getRentStatus(firstRent, config)} · ` +
        `Sample document status: ${getDocumentStatus(firstDocument, config)}`;
    } catch (error) {
      result.className = 'status alert alert-danger';
      result.textContent = `Data layer check failed: ${error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
